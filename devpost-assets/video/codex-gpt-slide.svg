  <text x="545" y="120" fill="#172135" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="42" font-weight="750">Built in conversation.</text>
  <text x="545" y="168" fill="#52657a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Tested in the browser. Revised when it did not feel right.</text>

