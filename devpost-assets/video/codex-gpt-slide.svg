<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f6f4ef"/>
  <rect x="0" y="0" width="468" height="720" fill="#265f52"/>
  <text x="64" y="105" fill="#dcebe6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">HOW I BUILT IT</text>
  <text x="64" y="220" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="60" font-weight="750">Codex</text>
  <text x="64" y="285" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="600">with GPT-5.6</text>
  <text x="64" y="390" fill="#dcebe6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Built through many small</text>
  <text x="64" y="425" fill="#dcebe6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">iterations, not one prompt.</text>
